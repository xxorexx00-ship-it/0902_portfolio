    <main id="main-content">

      <section class="preview-hero reveal">
        <div class="container">
          <p class="lp-back"><a href="../index.html#works">&larr; Works に戻る</a></p>
          <div class="preview-hero__row">
            <div class="preview-hero__col-title">
              <p class="preview-hero__category" id="previewCategory">Web Design</p>
              <h1 class="preview-hero__title" id="previewTitle">Loading...</h1>
            </div>
            <p class="preview-hero__desc" id="previewDesc"></p>
          </div>
        </div>
      </section>

      <section class="preview-frame-section reveal">
        <div class="container">

          <div class="preview-toolbar">
            <p class="preview-hint">クリックして全画面で操作できます</p>
            <a id="openNewTab" href="#" target="_blank" rel="noopener noreferrer" class="btn btn--outline btn--sm">新しいタブで開く &rarr;</a>
          </div>

          <div class="device-row">

            <!-- ノートPC型フレーム -->
            <button class="device-shell device-shell--laptop" id="deviceLaptop" aria-label="PC版を全画面で開く">
              <span class="device-shell__label">PC</span>
              <div class="laptop-frame">
                <div class="laptop-frame__screen">
                  <div class="laptop-frame__scale-wrap" id="laptopScaleWrap">
                    <iframe id="previewFrameLaptop" class="laptop-frame__iframe" tabindex="-1" title="作品プレビュー（PC）" loading="lazy"></iframe>
                  </div>
                  <div class="laptop-frame__glass" aria-hidden="true"></div>
                </div>
                <div class="laptop-frame__base" aria-hidden="true">
                  <span class="laptop-frame__notch"></span>
                </div>
              </div>
            </button>

            <!-- スマホ型フレーム -->
            <button class="device-shell device-shell--phone" id="devicePhone" aria-label="SP版を全画面で開く">
              <span class="device-shell__label">SP</span>
              <div class="phone-frame">
                <div class="phone-frame__notch" aria-hidden="true"></div>
                <div class="phone-frame__screen">
                  <div class="phone-frame__scale-wrap" id="phoneScaleWrap">
                    <iframe id="previewFrameGeneric" class="phone-frame__iframe" tabindex="-1" title="作品プレビュー（SP）" loading="lazy"></iframe>
                  </div>
                  <div class="phone-frame__glass" aria-hidden="true"></div>
                </div>
              </div>
            </button>

          </div>

          <p class="preview-note">※ サイトによっては埋め込み表示に対応していない場合があります。表示されない場合は「新しいタブで開く」をご利用ください。</p>
        </div>
      </section>

      <!-- 全画面モーダル -->
      <div class="device-modal" id="deviceModal" aria-hidden="true" role="dialog" aria-modal="true" aria-label="プレビュー全画面表示">
        <div class="device-modal__bar">
          <span class="device-modal__mode" id="deviceModalMode">PC</span>
          <button class="device-modal__close" id="deviceModalClose" aria-label="閉じる">&times;</button>
        </div>
        <div class="device-modal__body" id="deviceModalBody">
          <iframe id="previewFrameModal" class="device-modal__iframe" title="作品プレビュー（全画面）"></iframe>
        </div>
      </div>
